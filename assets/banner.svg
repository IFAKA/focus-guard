<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    <linearGradient id="lock" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdfa"/>
      <stop offset="100%" style="stop-color:#ccfbf1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.3"/>
  </pattern>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- Shield icon -->
  <g transform="translate(540, 180)">
    <!-- Shield shape -->
    <path d="M100 0 L180 30 L180 100 C180 160 100 200 100 200 C100 200 20 160 20 100 L20 30 Z"
          fill="url(#shield)" opacity="0.9"/>
    <!-- Lock body -->
    <rect x="65" y="95" width="70" height="55" rx="8" fill="url(#lock)"/>
    <!-- Lock shackle -->
    <path d="M75 95 L75 75 C75 55 125 55 125 75 L125 95"
          stroke="url(#lock)" stroke-width="12" fill="none" stroke-linecap="round"/>
    <!-- Keyhole -->
    <circle cx="100" cy="118" r="10" fill="#0891b2"/>
    <rect x="96" y="118" width="8" height="18" rx="2" fill="#0891b2"/>
  </g>

  <!-- Title -->
  <text x="640" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="#f8fafc" text-anchor="middle">Focus Guard</text>

  <!-- Subtitle -->
  <text x="640" y="510" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#94a3b8" text-anchor="middle">Stay focused. Block distractions. Get things done.</text>

  <!-- Chrome extension badge -->
  <g transform="translate(565, 550)">
    <rect width="150" height="32" rx="16" fill="#334155"/>
    <text x="75" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#e2e8f0" text-anchor="middle">Chrome Extension</text>
  </g>
</svg>
